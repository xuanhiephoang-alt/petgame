<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2a1b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PetGame</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b2a1b; overflow: hidden; touch-action: none; }
      #game { position: relative; width: 100vw; height: 100vh; height: 100dvh; font-family: system-ui, sans-serif; }
      #game canvas { display: block; }
      .labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
      .label { display: flex; flex-direction: column; align-items: center; gap: 3px; white-space: nowrap; }
      .label span { font-size: 12px; font-weight: 600; color: #fff; background: rgba(20,30,20,0.55);
        padding: 1px 8px; border-radius: 10px; }
      .label.me span { background: rgba(255,193,7,0.85); color: #3a2a00; }
      .label.pal span { font-size: 11px; opacity: 0; transition: opacity 0.2s; }
      .label.pal.hurt span { opacity: 1; }
      .hp-bar { width: 36px; height: 5px; background: rgba(0,0,0,0.6); border-radius: 3px; overflow: hidden; display: none; }
      .label.hurt .hp-bar { display: block; }
      .hp-bar div { height: 100%; background: #66bb6a; transition: width 0.15s; }
      .hud { position: absolute; inset: 0; pointer-events: none; color: #fff; z-index: 2; }
      .hud-status { position: absolute; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
        background: rgba(0,0,0,0.45); padding: 6px 10px; border-radius: 8px; font-size: 14px; line-height: 1.5;
        pointer-events: auto; max-width: calc(100vw - 24px); overflow-wrap: anywhere; }
      .hud-status a { color: #b3e5fc; }
      .hud-toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65);
        padding: 8px 14px; border-radius: 8px; font-size: 18px; opacity: 0; transition: opacity 0.2s; }
      .hud-toast.visible { opacity: 1; }
      .joystick-zone { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; pointer-events: auto; touch-action: none; }
      .joystick-base { display: none; position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px;
        border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); }
      .joystick-thumb { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; border-radius: 50%;
        background: rgba(255,255,255,0.45); transform: translate(-50%, -50%); }
.party-btn { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
        pointer-events: auto; border: none; border-radius: 20px; padding: 8px 14px; font-size: 15px; font-weight: 600;
        background: rgba(255,255,255,0.92); color: #2b3a24; box-shadow: 0 2px 6px rgba(0,0,0,0.25); cursor: pointer; }
      .party-panel { position: absolute; top: 144px; right: max(12px, env(safe-area-inset-right)); width: min(320px, calc(100vw - 24px));
        max-height: calc(100% - 140px); overflow-y: auto; pointer-events: auto; background: rgba(250,252,246,0.97); color: #253020;
        border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.3); padding: 10px; }
      .party-panel[hidden] { display: none; }
      .party-header { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 8px; font-size: 16px; }
      .party-close { border: none; background: none; font-size: 18px; cursor: pointer; width: 44px; height: 32px; }
      .party-list { display: flex; flex-direction: column; gap: 6px; }
      .party-empty { margin: 4px; font-size: 14px; color: #5b6a52; }
      .party-card { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; background: #fff; border: 2px solid transparent; }
      .party-card.follow { border-color: #7cb342; background: #f1f8e9; }
      .party-card.work { border-color: #ffb74d; background: #fff8e1; }
      .party-hint { margin: 2px 4px 6px; font-size: 13px; color: #8d6e63; }
      .party-xp { height: 4px; background: #e0e0e0; border-radius: 2px; margin-top: 4px; overflow: hidden; }
      .party-xp div { height: 100%; background: #42a5f5; }
      .party-buttons { display: flex; flex-direction: column; gap: 4px; }
      .party-action.work { background: #ffa726; }
      .party-action.rest { background: #e0e0e0; color: #333; }
      .party-action:disabled { opacity: 0.4; cursor: not-allowed; }
      .party-swatch { width: 34px; height: 34px; border-radius: 50%; flex: none; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15);
        display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
      .party-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
      .party-info small { color: #66735c; }
      .party-action { border: none; border-radius: 8px; padding: 6px 10px; min-height: 36px; min-width: 76px; font-weight: 600; cursor: pointer;
        background: #7cb342; color: #fff; }
      .label.companion span { font-size: 11px; font-weight: 500; }
      .float-text { font-size: 15px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000; animation: float-up 1.2s ease-out forwards; }
      @keyframes float-up { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-36px); opacity: 0; } }
      .base-btn { position: absolute; top: max(56px, calc(env(safe-area-inset-top) + 44px)); right: max(12px, env(safe-area-inset-right));
        pointer-events: auto; border: none; border-radius: 20px; padding: 8px 14px; font-size: 15px; font-weight: 600;
        background: rgba(255,224,178,0.95); color: #4e342e; box-shadow: 0 2px 6px rgba(0,0,0,0.25); cursor: pointer; }
      .party-panel { z-index: 3; }
      .craft-btn { position: absolute; top: max(100px, calc(env(safe-area-inset-top) + 88px)); right: max(12px, env(safe-area-inset-right));
        pointer-events: auto; border: none; border-radius: 20px; padding: 8px 14px; font-size: 15px; font-weight: 600;
        background: rgba(207,216,220,0.95); color: #263238; box-shadow: 0 2px 6px rgba(0,0,0,0.25); cursor: pointer; }
      .craft-icon { font-size: 26px; width: 34px; text-align: center; flex: none; }
      .craft-cost { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 3px; font-size: 13px; font-weight: 600; }
      .craft-cost span { white-space: nowrap; }
      .craft-cost .enough { color: #2e7d32; }
      .craft-cost .short { color: #c62828; }
      .craft-blocker { color: #c62828 !important; }
      .ball-btn { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
        pointer-events: auto; border: none; border-radius: 18px; padding: 6px 12px; font-size: 14px; font-weight: 600;
        background: rgba(255,255,255,0.9); color: #263238; box-shadow: 0 2px 6px rgba(0,0,0,0.25); cursor: pointer; }
      .ball-btn.great { background: #bbdefb; }
      .ball-btn.touch { right: max(150px, calc(env(safe-area-inset-right) + 150px)); bottom: 120px; }
      .party-action.feed { background: #8d6e63; }
      .action-btn { position: absolute; width: 76px; height: 76px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.6);
        color: #fff; font-size: 16px; font-weight: bold; pointer-events: auto; touch-action: none; }
      .action-btn:active { filter: brightness(1.3); }
      .btn-attack { right: max(110px, calc(env(safe-area-inset-right) + 110px)); bottom: 28px; background: rgba(229,115,115,0.7); }
      .btn-capture { right: max(24px, calc(env(safe-area-inset-right) + 24px)); bottom: 96px; background: rgba(79,195,247,0.7); }
      #lobby {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, sans-serif; color: #fff; background: #1b2a1b;
      }
      #lobby form { display: flex; flex-direction: column; gap: 12px; width: min(320px, 90vw); }
      #lobby h1 { margin: 0 0 8px; text-align: center; }
      #lobby input, #lobby button { font-size: 18px; padding: 12px; border-radius: 8px; border: none; }
      #lobby button { background: #7cc35a; color: #10200f; font-weight: bold; cursor: pointer; }
      #lobby .hint { font-size: 14px; opacity: 0.7; text-align: center; }
      #lobby .error { color: #ff8a80; text-align: center; min-height: 1em; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="lobby">
      <form id="join-form">
        <h1>🐾 PetGame</h1>
        <input id="name" placeholder="Tên của bạn" maxlength="16" autocomplete="nickname" />
        <button type="submit" id="join-btn">Vào chơi</button>
        <div class="hint" id="room-hint"></div>
        <div class="error" id="join-error"></div>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
