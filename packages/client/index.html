<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2a1b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PetGame</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b2a1b; overflow: hidden; touch-action: none; }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      #lobby {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, sans-serif; color: #fff; background: #1b2a1b;
      }
      #lobby form { display: flex; flex-direction: column; gap: 12px; width: min(320px, 90vw); }
      #lobby h1 { margin: 0 0 8px; text-align: center; }
      #lobby input, #lobby button { font-size: 18px; padding: 12px; border-radius: 8px; border: none; }
      #lobby button { background: #7cc35a; color: #10200f; font-weight: bold; cursor: pointer; }
      #lobby .hint { font-size: 14px; opacity: 0.7; text-align: center; }
      #lobby .error { color: #ff8a80; text-align: center; min-height: 1em; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="lobby">
      <form id="join-form">
        <h1>🐾 PetGame</h1>
        <input id="name" placeholder="Tên của bạn" maxlength="16" autocomplete="nickname" />
        <button type="submit" id="join-btn">Vào chơi</button>
        <div class="hint" id="room-hint"></div>
        <div class="error" id="join-error"></div>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
