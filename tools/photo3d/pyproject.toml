[project]
name = "photo3d"
version = "0.1.0"
description = "Textured 3D model from photos of an object's four sides"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
best = ["scipy>=1.10", "fast-simplification>=0.1.7", "rembg[cpu]>=2.0"]
dev = ["pytest>=8", "scipy>=1.10", "fast-simplification>=0.1.7"]

[project.scripts]
photo3d = "photo3d.__main__:main"

[tool.setuptools]
packages = ["photo3d"]

[tool.setuptools.package-data]
photo3d = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
